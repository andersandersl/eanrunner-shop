name: Deploy API to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api-cloud-run.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build container image
        run: |
          $IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPO }}/eanrunner-shop-api:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> $env:GITHUB_ENV
          gcloud builds submit api --tag $IMAGE
        shell: pwsh

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE }} `
            --image "$env:IMAGE" `
            --region "${{ secrets.GCP_REGION }}" `
            --platform managed `
            --allow-unauthenticated
        shell: pwsh